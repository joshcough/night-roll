name: tests
# Full test suite runs HERE, on GitHub's machines — never on Josh's.
# (2026-08-23: local Playwright runs pinned his CPU and blocked his writing.)
on:
  push:
    branches: [main]
    # App saves push albums/** (three commits per Save) and docs pushes touch
    # only .md — neither can change what the suite tests, and each run that
    # fails mails Josh. Code pushes still run everything; nightly covers the rest.
    paths-ignore:
      - "albums/**"
      - "handoffs/**"
      - "**.md"
  schedule:
    - cron: "0 9 * * *" # nightly
  workflow_dispatch:

jobs:
  vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
